[package]
name = "payment-simulators"
version = "0.1.0"
edition = "2021"
description = "Native Rust payment HSM simulators for Thales payShield 10K and Futurex Excrypt"

[[bin]]
name = "thales-simulator"
path = "src/bin/thales_simulator.rs"

[[bin]]
name = "futurex-simulator"
path = "src/bin/futurex_simulator.rs"

[[bin]]
name = "liquidsecurity-simulator"
path = "src/bin/liquidsecurity_simulator.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "net", "sync", "rt", "macros", "io-util", "rt-multi-thread", "signal"] }
des = "0.8"
aes = "0.8"
cipher = "0.4"
cmac = "0.7"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
hex = "0.4"
