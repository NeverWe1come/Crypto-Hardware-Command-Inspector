<svg width="256" height="256" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chciShieldGrad" x1="16" y1="8" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="chciBorderGrad" x1="16" y1="8" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="chciGoldGrad" x1="44" y1="44" x2="84" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="chciCircuitGrad" x1="28" y1="28" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Shield Outer Path -->
  <path d="M64 10 L108 26 C108 72 88 108 64 120 C40 108 20 72 20 26 Z" fill="url(#chciShieldGrad)" stroke="url(#chciBorderGrad)" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Inner Shield Accent Contour -->
  <path d="M64 18 L100 31 C100 68 84 98 64 109 C44 98 28 68 28 31 Z" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="3 3"/>

  <!-- Hardware Circuit Traces -->
  <line x1="64" y1="18" x2="64" y2="38" stroke="url(#chciCircuitGrad)" stroke-width="2" stroke-linecap="round" />
  <circle cx="64" cy="22" r="2" fill="#38bdf8" />
  <path d="M30 46 L46 46 L50 50" fill="none" stroke="url(#chciCircuitGrad)" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="34" cy="46" r="1.8" fill="#38bdf8" />
  <path d="M98 46 L82 46 L78 50" fill="none" stroke="url(#chciCircuitGrad)" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="94" cy="46" r="1.8" fill="#38bdf8" />
  <line x1="64" y1="90" x2="64" y2="108" stroke="url(#chciCircuitGrad)" stroke-width="2" stroke-linecap="round" />
  <circle cx="64" cy="104" r="2" fill="#38bdf8" />

  <!-- Silicon HSM Microchip -->
  <rect x="44" y="44" width="40" height="40" rx="6" fill="#090d16" stroke="url(#chciGoldGrad)" stroke-width="2.5"/>

  <!-- Microchip Contact Pins -->
  <line x1="52" y1="40" x2="52" y2="44" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
  <line x1="76" y1="40" x2="76" y2="44" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
  <line x1="52" y1="84" x2="52" y2="88" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
  <line x1="76" y1="84" x2="76" y2="88" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
  <line x1="40" y1="52" x2="44" y2="52" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
  <line x1="40" y1="76" x2="44" y2="76" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
  <line x1="84" y1="52" x2="88" y2="52" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
  <line x1="84" y1="76" x2="88" y2="76" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />

  <!-- Central Terminal Cursor -->
  <path d="M54 57 L62 64 L54 71" fill="none" stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="67" y1="71" x2="75" y2="71" stroke="#f59e0b" stroke-width="2.6" stroke-linecap="round" />
</svg>
