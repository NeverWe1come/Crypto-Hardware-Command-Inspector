[package]
name = "crypto-hardware-command-inspector"
version = "0.1.0"
description = "Crypto Hardware Command Inspector - Offline Security Diagnostic Tool"
authors = ["Crypto Hardware Command Inspector Contributors"]
edition = "2021"

[lib]
name = "chci_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
